<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چت‌بات مهام خودرو</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f0f4ff;
            direction: rtl;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        h1 { color: #4368E6; text-align: center; }
        .chat-box {
            height: 400px;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 15px;
            overflow-y: auto;
            margin: 20px 0;
            background: #fafafa;
        }
        .msg {
            padding: 10px 16px;
            border-radius: 12px;
            margin: 8px 0;
            max-width: 80%;
            white-space: pre-wrap;
        }
        .user {
            background: #4368E6;
            color: white;
            margin-right: auto;
            text-align: right;
        }
        .bot {
            background: #e8edfc;
            color: #1a1a2e;
            margin-left: auto;
            text-align: right;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        .input-area input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }
        .input-area button {
            padding: 12px 24px;
            background: #4368E6;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }
        .input-area button:hover {
            background: #2d4ec9;
        }
        .status {
            text-align: center;
            padding: 10px;
            color: #666;
            font-size: 14px;
        }
        .error {
            color: #e74c3c;
            background: #fde8e8;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        .success {
            color: #27ae60;
            background: #e8f8ed;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid #ddd;
            border-top: 3px solid #4368E6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 چت‌بات مهام خودرو</h1>
        
        <div id="status" class="status">🔌 در حال اتصال...</div>
        
        <div class="chat-box" id="chatBox">
            <div class="msg bot">سلام! 👋 چطور می‌توانم کمک کنم؟</div>
        </div>
        
        <div class="input-area">
            <input type="text" id="userInput" placeholder="سوال خود را بپرسید..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">ارسال</button>
        </div>
    </div>

    <script>
        // ============================================
        // تنظیمات - با CORS Proxy
        // ============================================
        const TOKEN = "MDkxNDA3NTAxMTM6QG1haGFtNDA1";
        const PROXY = "https://corsproxy.io/?";
        const API_URL = "https://ai.boxapi.ir/api/v1";

        // ============================================
        // تابع اصلی
        // ============================================
        async function getAIResponse(message) {
            try {
                console.log("📤 ارسال:", message);
                
                const response = await fetch(`${PROXY}${encodeURIComponent(API_URL)}/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${TOKEN}`
                    },
                    body: JSON.stringify({
                        model: "gpt-4o-mini",
                        messages: [
                            { 
                                role: "system", 
                                content: "شما دستیار هوشمند سایت مهام خودرو هستید. درباره خودرو، قیمت، برندها، اقساط، ضمانت و خدمات پس از فروش پاسخ دهید."
                            },
                            { role: "user", content: message }
                        ],
                        temperature: 0.7,
                        max_tokens: 500
                    })
                });

                console.log("📥 وضعیت:", response.status);

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`خطا ${response.status}: ${errorText}`);
                }

                const data = await response.json();
                return data.choices[0].message.content;
            } catch (error) {
                console.error("❌ خطا:", error);
                return null;
            }
        }

        // ============================================
        // مدیریت چت
        // ============================================
        let isProcessing = false;

        function addMessage(text, isUser = false) {
            const chatBox = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = `msg ${isUser ? 'user' : 'bot'}`;
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function addLoading() {
            const chatBox = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = 'msg bot';
            div.id = 'loadingMsg';
            div.innerHTML = '<span class="loading"></span> در حال دریافت پاسخ...';
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function removeLoading() {
            const loading = document.getElementById('loadingMsg');
            if (loading) loading.remove();
        }

        async function sendMessage() {
            if (isProcessing) return;
            
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;
            
            isProcessing = true;
            addMessage(text, true);
            input.value = '';
            
            addLoading();
            
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = '⏳ در حال دریافت پاسخ از AI...';
            statusDiv.className = 'status';
            
            try {
                const response = await getAIResponse(text);
                removeLoading();
                
                if (response) {
                    addMessage(response, false);
                    statusDiv.innerHTML = '✅ پاسخ دریافت شد';
                    statusDiv.className = 'status success';
                } else {
                    addMessage("❌ متاسفم، پاسخ دریافت نشد. لطفاً دوباره تلاش کنید.", false);
                    statusDiv.innerHTML = '❌ خطا در دریافت پاسخ';
                    statusDiv.className = 'status error';
                }
            } catch (error) {
                removeLoading();
                addMessage(`❌ خطا: ${error.message}`, false);
                statusDiv.innerHTML = `❌ خطا: ${error.message}`;
                statusDiv.className = 'status error';
            }
            
            isProcessing = false;
        }

        // تست اتصال
        async function testConnection() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = '⏳ تست اتصال...';
            
            const testResponse = await getAIResponse("سلام، فقط بگو 'اتصال برقرار است'");
            
            if (testResponse) {
                statusDiv.innerHTML = '✅ اتصال برقرار است!';
                statusDiv.className = 'status success';
                addMessage(`✅ تست موفق: ${testResponse}`, false);
            } else {
                statusDiv.innerHTML = '❌ اتصال ناموفق. لطفاً دوباره تلاش کنید.';
                statusDiv.className = 'status error';
            }
        }

        // اجرا در شروع
        window.onload = function() {
            setTimeout(testConnection, 1000);
        };
    </script>
</body>
</html>
